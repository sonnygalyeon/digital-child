name: Windows desktop bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install uv
      - name: Build desktop bundle
        shell: powershell
        run: .\scripts\windows\build_desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DigitalChild-windows-x64
          path: |
            dist/DigitalChild-windows-x64.zip
            dist/DigitalChild-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
