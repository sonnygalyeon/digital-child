[project]
name = "digital-child"
version = "0.4.1"
description = "Fast Unicode terminal chat with background verification and a separate animated human-like desktop face."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.30,<1",
    "prompt-toolkit>=3.0.52,<4",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8,<7",
]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
digital-child = "digital_child.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_child"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["digital_child"]
